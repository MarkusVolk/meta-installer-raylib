# Enables WiFi support for a real, confirmed-present Realtek RTW89-
# family card (RTL8852BE, PCIe) - values given directly by the person
# building this (matches their own working desktop config). WLAN/
# CFG80211/MAC80211 top-level gates re-enabled here (previously
# disabled entirely in disable-unused-subsystems.cfg, see that file's
# own updated comment) - RTW89 depends on all three, Kconfig's own
# dependency resolution would otherwise silently drop it even with
# these three lines present here.
#
# iwd (the userspace WiFi daemon this project uses instead of
# wpa_supplicant - smaller dependency footprint, confirmed directly
# against real oe-core/meta-openembedded recipes: iwd needs only
# "dbus", wpa_supplicant additionally needs "libnl") talks to the
# kernel via nl80211 (part of cfg80211) regardless of which of these
# is enabled - the driver/firmware choice below is independent of
# that daemon choice.
#
# NOTE: only this ONE specific chip variant (8852BE) is enabled - not
# the whole RTW89 family - deliberately narrow, matching this
# project's own general preference for minimal, targeted hardware
# support over enabling everything speculatively. Add the matching
# option for a specific different chip variant here too (same
# "RTW89_" prefix, chip name suffix - see the kernel's own Kconfig
# under drivers/net/wireless/realtek/rtw89/) if support for a
# different RTW89-family card is ever needed.
CONFIG_WLAN=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RTW89=m
CONFIG_RTW89_PCI=m
CONFIG_RTW89_8852BE=m
CONFIG_WLAN_VENDOR_INTEL=y
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
#
# The kernel's userspace crypto API (AF_ALG sockets) built in, not as
# modules: iwd checks for HMAC/CMAC/AES/DES via AF_ALG at startup
# (src/main.c, check_crypto()) and exits with "Due to the missing
# options, iwd will not start" when the hash/skcipher socket types are
# unavailable. linux-yocto's own defaults build all three as modules
# (=m), and those modules (af_alg, algif_hash, algif_skcipher) only
# reach the image as part of the "kernel-modules" umbrella - which
# installer-minimal-raylib.conf blocks on purpose via
# BAD_RECOMMENDATIONS. Found via a real report that iwd.service no
# longer started: the last image that still had all kernel modules
# installed (2026-08-29) shipped these three, every trimmed image since
# ships only michael_mic.ko in kernel/crypto/. Built in here (rather
# than adding three more kernel-module-* recommendations) because
# unlike a WiFi driver they aren't hardware-specific - iwd needs them
# on every machine that has WiFi enabled at all.
CONFIG_CRYPTO_USER_API=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
