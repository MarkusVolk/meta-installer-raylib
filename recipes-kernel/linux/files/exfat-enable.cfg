# Enables exFAT filesystem support - found missing while adding
# automatic detection of separate, removable USB sticks holding
# rootfs.tar.gz/.wic files for the installer app (see files/init in
# the initramfs-installer-raylib recipe, and main.cpp's
# discover_local_file_candidate_dirs()). Checked directly against the
# real, uploaded .config: VFAT support was already present (needed for the
# ESP anyway, so already covered), the EXFAT_FS option was not set at all.
#
# exFAT matters here specifically, not just as a "nice to have" -
# FAT32 has a hard 4GiB per-file size limit, and a full wic image can
# easily exceed that, so a USB stick actually holding one is
# plausibly exfat-formatted (the common choice once a stick outgrows
# FAT32) rather than plain vfat.
CONFIG_EXFAT_FS=y
