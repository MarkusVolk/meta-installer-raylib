# Disables entire kernel subsystems this project has no use for, at
# the KERNEL level - found via a direct review of a real, uploaded
# .config (over 500 active options across these five categories
# combined). DISTRO_FEATURES_OPTED_OUT (wifi, bluetooth, audio/alsa
# in installer-minimal-raylib.conf) only controls which USERSPACE
# packages get installed - it has no effect on kernel configuration
# at all, a completely separate axis this project had assumed was
# linked but isn't. These BSP defconfig defaults were apparently never
# revisited for this project's actual, much narrower hardware-support
# needs (display + storage + basic input, nothing wireless/audio/TV-
# tuner/NFC related).
#
# Disabling the top-level gate for each subsystem rather than listing
# every individual leaf option - kernel Kconfig's own dependency
# resolution cascades this down to everything underneath
# automatically (WLAN_VENDOR_*/ATH9K/IWLWIFI/BRCMFMAC/RT2X00 etc. all
# depend on WLAN; the whole SND_* tree (sound drivers) depends on
# SOUND/SND;
# DVB and V4L2/media drivers depend on MEDIA_SUPPORT; Bluetooth
# controller drivers depend on BT).
#
# RAID/device-mapper (MD_RAID*, DM_CRYPT) deliberately left untouched
# despite also being unused by this project directly - a rescue/
# installer image may need to recognize LVM/RAID-based layouts on the
# systems it's rescuing/reinstalling, unlike bluetooth/sound/TV-
# tuner/NFC hardware support, which this project has no plausible use
# for under any circumstance.
#
# WLAN/CFG80211/MAC80211 REMOVED from this disable list - see
# wifi-enable.cfg, added once actual WiFi hardware support (iwd +
# RTW89 for a real Realtek RTW89-family card) became a real
# requirement, no longer "no plausible use for under any
# circumstance" like the rest of this file's own reasoning above.
CONFIG_SOUND=n
CONFIG_SND=n
CONFIG_MEDIA_SUPPORT=n
CONFIG_BT=n
CONFIG_NFC=n
