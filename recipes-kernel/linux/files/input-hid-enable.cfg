# HID multitouch: many compact keyboard+touchpad combos report their
# touchpad via the HID multitouch digitizer protocol, not simple
# relative-mode HID mouse - was disabled, keyboard works (basic HID
# boot protocol) but touchpad doesn't.
CONFIG_HID_MULTITOUCH=y

# /dev/hidrawX - not required for basic evdev-based input, but useful
# for diagnosing raw HID reports if a touchpad still misbehaves.
CONFIG_HIDRAW=y
