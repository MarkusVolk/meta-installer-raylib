#@TYPE: Machine
#@NAME: Generic x86_64
#@DESCRIPTION: Machine configuration for generic x86_64 (64-bit) PCs booting via EFI.
# Modeled on meta-yocto-bsp's genericx86-64 (X server bits left out - this
# layer's images render via DRM only), so this layer works with plain
# openembedded-core, no separate BSP layer needed.

DEFAULTTUNE ?= "core2-64"
require conf/machine/include/x86/tune-x86-64-v3.inc
require conf/machine/include/genericx86-common.inc

#For runqemu
QB_SYSTEM_NAME = "qemu-system-x86_64"
