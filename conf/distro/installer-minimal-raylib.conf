DISTRO = "installer-minimal-raylib"
DISTRO_NAME = "OpenEmbedded (Installer, minimal, raylib/Software-Rendering)"
DISTRO_VERSION = "1.0"

PACKAGE_CLASSES ?= "package_ipk"

# NOTE: DISTRO_FEATURES = "..." with plain "=" does NOT keep out
# DISTRO_FEATURES_DEFAULTS - meta/conf/bitbake.conf unconditionally
# appends any DISTRO_FEATURES_DEFAULTS entry not listed in
# DISTRO_FEATURES_OPTED_OUT. Without the opt-out list below, wayland,
# x11, vulkan, pulseaudio, bluetooth etc. would silently reappear.
# opengl deliberately NOT enabled (removed again, see below for why):
# the AMD blank-screen issue's actual root cause turned out to be
# CONFIG_DRM_AMDGPU missing from the kernel config entirely - hardware
# GLES2 rendering (opengl DISTRO_FEATURE, mesa-megadriver, GBM/EGL) was
# added as a hypothesis before that was found, based on unverified
# speculation about AMD's DCN stack needing atomic modesetting/GBM.
# Software rendering (raylib's default DRM dumb-buffer path) only
# needs basic KMS modesetting from whatever DRM driver is active - it
# doesn't care whether that's amdgpu, i915, or anything else, and
# doesn't need mesa/GBM/EGL at all. With the kernel fix in place
# (recipes-kernel/linux), this simpler path should work equally well.
#
# Want to try real hardware-accelerated GLES2 on a platform you know
# supports it? Don't remove "opengl" from DISTRO_FEATURES_OPTED_OUT
# below - that would flip the DEFAULT for everyone building this
# layer, since opengl is itself part of oe-core's own
# DISTRO_FEATURES_DEFAULTS (meta/conf/distro/include/
# default-distrovars.inc) and gets silently backfilled the moment
# it's no longer opted out. Override it locally instead, in your OWN
# local.conf (leaves this shared layer's default untouched) - either:
#   DISTRO_FEATURES:append = " opengl"
# (the more common/expected pattern for turning on a DISTRO_FEATURE
# locally - works fine despite "opengl" staying in this layer's own
# DISTRO_FEATURES_OPTED_OUT list below, confirmed with a real
# "bitbake-getvar DISTRO_FEATURES" trace - see wifi's own, more
# detailed comment on this exact same mechanism further down for the
# full reasoning), or:
#   DISTRO_FEATURES_OPTED_OUT:remove = "opengl"
# This flows straight into raylib's own PACKAGECONFIG (see
# recipes-graphics/raylib/raylib_6.0.bb: "PACKAGECONFIG:append =
# ${@bb.utils.filter('DISTRO_FEATURES', 'opengl', d)}"), switching it
# from the DRM dumb-buffer path to GLES2 (mesa/virtual-egl/
# virtual-libgles2 pulled in automatically).
#
# wifi: same opt-in pattern, same reason (also part of oe-core's own
# DISTRO_FEATURES_DEFAULTS, so opted out here explicitly). Off by
# default because not every machine this layer might build for
# actually has WiFi hardware, and pulling in iwd/firmware/kernel
# drivers unconditionally would be wasted space on those that don't.
# This project's own kernel-config fragment for a real, confirmed
# RTW89-family card (recipes-kernel/linux/files/wifi-enable.cfg) and
# this project's own iwd/firmware package additions (recipes-core/
# images/) are BOTH themselves gated on this same DISTRO_FEATURE via
# bb.utils.contains()/bb.utils.filter(), not just this opt-out list -
# turning wifi on here (either way below) is the single switch that
# turns on both.
#
# Two ways to turn it on locally - both really do work, checked
# directly with a real "bitbake-getvar DISTRO_FEATURES" trace, not
# just reasoned about (an earlier version of this comment claimed the
# plain append "wouldn't be enough, it would get silently backfilled
# the same way" - that claim was wrong, corrected here after actually
# testing it):
#
#   DISTRO_FEATURES:append = " wifi"
#
# The far more common/expected pattern for turning on a DISTRO_FEATURE
# locally - and it works fine here despite "wifi" being in THIS
# layer's own DISTRO_FEATURES_OPTED_OUT list, because that list only
# ever affects oe-core's own separate DISTRO_FEATURES_DEFAULTS-derived
# append (bitbake.conf's own "oe.utils.filter_default_features()"
# call) - it has no effect on a plain, independent append like this
# one from local.conf, which lands in the final DISTRO_FEATURES value
# either way, confirmed directly via the real, fully-expanded
# variable trace.
#
#   DISTRO_FEATURES_OPTED_OUT:remove = "wifi"
#
# Also still works (removes it from this list, letting oe-core's own
# DEFAULTS-derived append backfill it in instead) - kept documented as
# an alternative since it was this project's own original approach,
# but the plain append above is simpler and just as effective, so it's
# the one to reach for first.
#
# IMPORTANT either way: this layer's own conf/layer.conf deliberately
# has NO LAYERDEPENDS on meta-openembedded (iwd's own layer, not part
# of oe-core) - forcing every single build of this layer to require
# meta-openembedded in bblayers.conf just in case wifi might someday
# get enabled would be unnecessary friction for the (default, far
# more common) case where it never does. Add meta-openembedded's own
# meta-oe layer to your OWN bblayers.conf yourself alongside whichever
# override above you use - bitbake will otherwise fail with a clear
# "nothing provides iwd" once wifi is actually turned on, not before.
DISTRO_FEATURES = " \
    ext2 \
    ipv4 \
    ipv6 \
    largefile \
    pci \
    systemd \
    systemd-resolved \
    usbhost \
    usrmerge \
    vfat \
    xattr \
"

DISTRO_FEATURES_OPTED_OUT += " \
    sysvinit \
    acl \
    alsa \
    bluetooth \
    debuginfod \
    wifi \
    nfs \
    zeroconf \
    3g \
    nfc \
    x11 \
    seccomp \
    pulseaudio \
    gobject-introspection-data \
    opengl \
    wayland \
    vulkan \
    ptest \
    ldconfig \
    multiarch \
"

# oe-core's own packagegroup-base.bb pulls WiFi support in via
# packagegroup-base-wifi (part of packagegroup-base-extended, itself
# part of packagegroup-core-boot's own transitive RDEPENDS) whenever
# "wifi" is in DISTRO_FEATURES - defaulting to wpa-supplicant via its
# own WIRELESS_DAEMON variable (confirmed directly in the real source:
# "WIRELESS_DAEMON ??= \"wpa-supplicant\"", with the comment right
# above it literally saying "Choose either 'wpa-supplicant' or 'iwd'
# as wireless-daemon" - an intentional, documented override point,
# not something to work around). This project made its own, deliberate
# choice of iwd instead (smaller footprint, confirmed directly against
# the real recipes: iwd only needs "dbus", wpa-supplicant additionally
# needs "libnl") - overridden here with a hard "=" (not oe-core's own
# weak "??=") to make sure this project's own choice always wins
# regardless of variable-assignment ordering.
WIRELESS_DAEMON = "iwd"

# "systemd-resolved" in DISTRO_FEATURES above (unconditional, not
# WiFi-gated - equally relevant for the disk-backed image's own
# ethernet/networkd path) - found via a real user report: iwd only
# ever handles the WiFi LINK layer (WPA handshake etc.) itself,
# confirmed connected via iwctl directly, but plain curl still failed
# outright afterwards. Root cause confirmed directly in iwd's own
# documentation (src/iwd.config.rst): "EnableNetworkConfiguration"
# (IP address assignment via iwd's own built-in DHCP client) defaults
# to **false** - with it left off, iwd never requests or applies an IP
# address at all once associated, regardless of how solid the
# underlying WiFi link itself is.
#
# Enabling that alone still leaves DNS resolution unaddressed -
# iwd.config.rst's own "NameResolvingService" option (how iwd pushes
# DHCP-provided DNS servers into the rest of the system) defaults to
# "systemd", meaning systemd-resolved integration specifically, not
# just "any DNS resolver already present". Deliberately chosen over
# the simpler alternatives (a hardcoded public DNS server in a static
# /etc/resolv.conf, or NameResolvingService=none) - this project's own
# WiFi UI can connect to an arbitrary network the person picks, which
# may well be a local/private one (matching this project's own
# earlier local_default_dir HTTP-server workflow) where only that
# network's own DHCP-provided DNS server can resolve local hostnames
# at all; a hardcoded public one couldn't.
#
# Checked directly against the real, current oe-core systemd recipe
# before adding this: "resolved" and "nss-resolve" (systemd-resolved's
# own build-time PACKAGECONFIG requirements) are ALREADY part of
# systemd's own upstream DEFAULT PACKAGECONFIG list, and this
# project's own systemd_%.bbappend does not remove either (its own
# PACKAGECONFIG:remove comment explicitly leaves both as "genuinely
# ambiguous, left for a separate, more careful pass") - meaning no
# systemd rebuild/reconfiguration is actually needed here, only
# installing the already-buildable systemd-resolved package itself
# (see core-image-installer-raylib.bb and its initramfs counterpart's
# own IMAGE_INSTALL) and iwd's own main.conf turning both options on
# (see iwd/files/main.conf).

IMAGE_FSTYPES = "wic wic.bmap tar.gz"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
SYSTEMD_DEFAULT_TARGET = "multi-user.target"
VIRTUAL-RUNTIME_dev_manager = "systemd"
VIRTUAL-RUNTIME_login_manager = "shadow-base"
KERNEL_FEATURES:append = " cfg/systemd.scc"

VIRTUAL-RUNTIME_base-utils = "coreutils"
VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"
VIRTUAL-RUNTIME_base-utils-syslog = ""

ROOT_HOME = "/root"
EXTRA_IMAGE_FEATURES = ""

# alsa ends up in MACHINE_FEATURES not because any machine .conf this
# project actually uses set it deliberately, but because it's baked
# directly into oe-core's own generic x86 baseline (confirmed directly
# in the real source, meta/conf/machine/include/x86/x86-base.inc:
# "MACHINE_FEATURES += \"... alsa\"" - every x86 machine inherits this,
# not something specific to intel-corei7-64 itself). Pointless for
# this project regardless of that: this project's own kernel config
# already disables sound entirely at the kernel level (SOUND/SND, see
# recipes-kernel/linux/files/disable-unused-subsystems.cfg's own
# comments) - MACHINE_FEATURES still containing "alsa" on top of that
# would only pull in userspace ALSA libraries/utilities with no actual
# kernel-side sound driver underneath them to talk to. Found via a
# direct user report after noticing it being pulled into a real build.
#
# MACHINE_FEATURES:remove here, NOT MACHINE_FEATURES_OPTED_OUT -
# despite oe-core's own conf/documentation.conf recommending the
# latter ("Prefer opting out of features using this variable instead
# of using MACHINE_FEATURES:remove"), a real, direct test showed
# MACHINE_FEATURES_OPTED_OUT does NOT actually remove "alsa" here,
# only MACHINE_FEATURES:remove does. Most likely explanation:
# MACHINE_FEATURES_OPTED_OUT is itself only a renamed alias for the
# older MACHINE_FEATURES_BACKFILL_CONSIDERED (confirmed in the real
# source, bitbake.conf's own BB_RENAMED_VARIABLES entry) - a mechanism
# that only affects features added through oe-core's own MACHINE_
# FEATURES_BACKFILL default-additions list, not ones a machine .conf
# sets directly via a plain "+=" the way x86-base.inc does for "alsa"
# specifically. Real, tested behavior trumps the general
# documentation's own stated preference here.
MACHINE_FEATURES:remove = "alsa"

# Explicit (plain "=", not "?=") rather than relying on whichever
# machine .conf happens to be in use to default it correctly on its
# own. meta-intel's own conf/machine/include/meta-intel.inc sets
# "EFI_PROVIDER ?= \"systemd-boot\"" (confirmed directly in its real
# source) - a WEAK default, meaning any machine that sets it
# differently (or a layer that doesn't set it at all) would silently
# change what this project actually gets. This matters here
# specifically because this project's own initramfs-home-mount
# recipe (recipes-apps/initramfs-home-mount/) depends on reading the
# "LoaderDevicePartUUID" EFI variable - a systemd-boot-specific
# convention, not something grub-efi (a common alternative
# EFI_PROVIDER default, e.g. meta-yocto-bsp's own genericx86-64
# machine) would ever populate. Pinning it here, in this project's own
# distro conf, means that mechanism keeps working correctly regardless
# of which specific machine .conf ends up being used underneath -
# found while considering a possible switch away from meta-intel's own
# intel-corei7-64 (itself somewhat mismatched for this project, which
# has already confirmed both AMD and Intel hardware working) toward
# oe-core's own more hardware-neutral options, and realizing this
# project's own build had so far only worked correctly by relying on
# a default it never actually controlled itself.
EFI_PROVIDER = "systemd-boot"

# Package recommendations: the BSP (meta-intel's own machine include)
# recommends "kernel-modules" (every single module the kernel builds,
# ~700 packages / ~70 MB in this image) plus the whole "linux-firmware"
# umbrella, udev recommends its 22 MB hwdb, systemd its mime types -
# none of it needed by a DRM-only rescue/installer app. Found via a
# README-vs-reality audit: the initramfs had grown to 969 packages,
# while this layer's own comments (systemd bbappend) assumed
# recommendations were already off. Blocked selectively via
# BAD_RECOMMENDATIONS rather than NO_RECOMMENDATIONS=1 so the useful
# ones keep working (curl -> ca-certificates for HTTPS, systemd ->
# systemd-conf carrying this layer's own journald drop-in, the BSP's
# own i915/igc/r8152 module and i915 firmware picks).
#
# The modules this image actually needs are added as recommendations
# too, not as hard IMAGE_INSTALL entries: a kernel-module-* package
# only exists while the driver is built as a module (=m). The last
# linux-yocto bump already flipped several drivers between =m and =y;
# a recommendation for a now-builtin driver is silently skipped, a
# hard dependency would fail the whole image build.
# linux-firmware-i915 (~27 MB of GuC/HuC/DMC blobs for every Intel
# GPU generation, recommended by meta-intel's machine include) stays
# blocked, but for a different reason than originally: it was first
# dropped to verify the README's claim that Intel display init needs
# no separate firmware for software rendering. Tested on real
# hardware with exactly this image, and the claim turned out WRONG
# for discrete DG2/Arc cards (GT wedged without GuC, drmModeSetCrtc()
# -5). Instead of re-adding the whole umbrella, this layer ships only
# the two DG2 blobs actually requested by the kernel (~400 KB) via its
# own linux-firmware-i915-dg2 package - see recipes-kernel/
# linux-firmware/linux-firmware_%.bbappend for the full story and the
# image recipes for where it's installed.
BAD_RECOMMENDATIONS += "kernel-modules linux-firmware udev-hwdb systemd-mime systemd-extra-utils linux-firmware-i915"
# genericarm64 (this layer's own machine, see conf/machine/) builds its
# storage/USB/network drivers as modules and, like meta-yocto-bsp's
# original, relies on "all modules installed" - blocking the umbrella
# there would leave the initramfs installer without a way to reach its
# own USB stick. x86 keeps the trimmed set above.
BAD_RECOMMENDATIONS:remove:genericarm64 = "kernel-modules"
MACHINE_EXTRA_RRECOMMENDS:append = " kernel-module-amdgpu kernel-module-r8169"
MACHINE_EXTRA_RRECOMMENDS:append = "${@bb.utils.contains('DISTRO_FEATURES', 'wifi', ' kernel-module-iwlmvm kernel-module-rtw89-8852be', '', d)}"

