[Journal]
# Explicitly volatile (RAM-only, /run/log/journal) rather than relying
# on systemd's own "auto" default (persistent IF /var/log/journal
# already exists as a directory, volatile otherwise) - found while
# doing a direct security review after a WiFi passphrase was found
# leaking into this project's own on-screen log: even though that
# specific log is only ever kept in this app's own in-memory GUI
# state (not written to the journal itself), removing any reliance on
# a directory-existence heuristic for whether journal content
# ever touches the real, persistent disk is a cheap, unambiguous
# extra safety margin for a rescue/installer image that has no real
# ongoing need for boot logs to survive a reboot anyway (each boot is
# its own, fresh installation session) - also reduces disk
# wear/usage on the installer medium as a side benefit.
Storage=volatile
