[General]
# iwd only ever handles the WiFi LINK layer itself (WPA handshake
# etc.) by default - without this, iwd never requests/applies an IP
# address at all once associated, no matter how solid the underlying
# WiFi link is. Confirmed directly in iwd's own documentation (src/
# iwd.config.rst): this option defaults to false. See this project's
# own installer-minimal-raylib.conf for the full story (a real user
# report: WiFi showed as connected via iwctl, but plain curl still
# failed outright).
EnableNetworkConfiguration=true

[Network]
# Pushes DHCP-provided DNS servers into systemd-resolved specifically
# (this is iwd's own actual default value too - listed explicitly
# here rather than left implicit, since getting this right is exactly
# the point of this whole file). Deliberately not "none" or relying on
# a hardcoded public DNS server - this project's own WiFi UI can
# connect to an arbitrary network the person picks, which may well be
# a local/private one where only that network's own DHCP-provided DNS
# server can resolve local hostnames at all.
NameResolvingService=systemd
