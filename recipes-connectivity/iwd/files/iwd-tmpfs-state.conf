[Service]
# iwd's own packaged unit sets "StateDirectory=iwd" - systemd's own
# convention for this directive always creates the resulting
# directory under /var/lib/, which is part of the REAL, PERSISTENT
# rootfs on this project's own disk-backed installer image (not
# tmpfs) - meaning iwd's own default behavior (saving a connected
# network's PSK to a profile file for future auto-reconnection) would
# write the WiFi passphrase to genuinely non-volatile storage on the
# installer medium itself. Found while investigating a real, direct
# security report about this same passphrase appearing in this
# project's own on-screen log - a related but separate leak path,
# caught while checking for others.
#
# Overridden here instead of just leaving iwd's own default: an
# installer/rescue image has no real ongoing need for iwd to
# remember a network across reboots anyway (each boot is its own,
# fresh installation session) - RuntimeDirectory=iwd creates /run/iwd
# instead, using systemd's own /run convention (already tmpfs-backed,
# the same way /run always is) - explicitly pointing iwd's own
# STATE_DIRECTORY environment variable at that instead of leaving it
# to whatever StateDirectory= alone would have set it to (confirmed
# directly in iwd's own real source, src/storage.c: it just reads
# whatever STATE_DIRECTORY value is present, not tied specifically to
# systemd's own StateDirectory= directive semantics) is what actually
# redirects iwd's own writes there - RuntimeDirectory= alone wouldn't
# have done that on its own.
StateDirectory=
RuntimeDirectory=iwd
Environment=STATE_DIRECTORY=/run/iwd
